# OTel Collector — F1 §2.1, §2.2 (K24)
#
# İki taşıyıcı karar burada:
#   1. syslog receiver `protocol: none` — çerçeveleme ve PRI collector'da kalır,
#      GÖVDE OLDUĞU GİBİ gelir. RFC modunda orijinal satır geri alınamıyor ve bu
#      ham arşiv + replay hedefiyle çelişiyor. Ayrıştırmanın tamamı .NET tarafında.
#   2. file_storage kalıcı kuyruk — backpressure zincirinin dayanağı. .NET servisi
#      503 dönerse collector yeniden dener; kendi kuyruğumuzu yazmıyoruz (K5).

extensions:
  file_storage/queue:
    directory: /var/lib/otelcol/queue
    timeout: 10s
    # Birim boş bağlanıyor; alt dizin yoksa collector "directory must exist" ile ölür.
    create_directory: true

receivers:
  # KODLAMA — ham sadakatin bağlı olduğu ayar (F1 §2.4).
  #
  # Varsayılan `utf-8` geçersiz baytları U+FFFD ile DEĞİŞTİRİR: windows-1254 bir
  # FortiGate satırı bize ulaşmadan geri dönülemez biçimde bozulur.
  #
  # `nop` ilk akla gelen çözümdü ama bu receiver'da ÇALIŞMIYOR:
  #   - UDP: girdinin varsayılan `line_end_pattern` değeri var, `nop` ile birlikte
  #     "line_end_pattern should not be set when using nop encoding" hatası veriyor.
  #   - TCP: `nop` seçilirse bölücü NoSplitFunc'a düşüyor ve syslog ÇERÇEVELEMESİ
  #     kayboluyor — TCP akışının tamamı tek bir kayda dönüşüyor. Sessiz ve çok
  #     daha kötü bir hata. (Framing ancak `enable_octet_counting` ile korunur,
  #     onu da cihazların çoğu göndermiyor.)
  #
  # `iso-8859-1` her iki sorunu da çözüyor: 0x00-0xFF baytları U+0000-U+00FF kod
  # noktalarına BİREBİR ve TERSİNİR eşleniyor, satır bölme çalışmaya devam ediyor
  # ve telde geçerli UTF-8 taşınıyor. Orijinal baytlar bizde
  # `Encoding.Latin1.GetBytes(body)` ile aynen geri alınıyor.
  #
  # `utf-8-raw` da bayt geçirgen ama gövde protobuf `string_value` alanına
  # geçersiz UTF-8 olarak yazılırdı; .NET tarafında çözümleme U+FFFD üretir.
  syslog/tcp:
    tcp:
      listen_address: "0.0.0.0:5140"
      encoding: iso-8859-1
      add_attributes: true      # net.peer.* — kaynak kimliği T06'da buradan çözülüyor
    protocol: none
    # Taşımayı ve tel kodlamasını tahmin etmek yerine söylüyoruz: semconv sürümle
    # değişiyor, bu öznitelikler bizim sözleşmemiz.
    attributes:
      bizigo.transport: syslog-tcp
      bizigo.wire_encoding: iso-8859-1

  syslog/udp:
    udp:
      listen_address: "0.0.0.0:5141"
      encoding: iso-8859-1
      add_attributes: true
    protocol: none
    attributes:
      bizigo.transport: syslog-udp
      bizigo.wire_encoding: iso-8859-1

  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch:
    send_batch_size: 2000
    send_batch_max_size: 4000
    timeout: 2s

  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15

exporters:
  otlp_http/bizigo:
    endpoint: ${env:BIZIGO_ENDPOINT}
    encoding: proto
    # T09'da eklenecek: auth: { authenticator: oauth2client }
    tls:
      insecure: true
    sending_queue:
      enabled: true
      storage: file_storage/queue
      num_consumers: 4
      queue_size: 10000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0     # süresiz yeniden dene — veri kaybetmektense birikt

  debug:
    verbosity: basic

service:
  extensions: [file_storage/queue]
  pipelines:
    logs:
      receivers: [syslog/tcp, syslog/udp, otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/bizigo]
  telemetry:
    logs:
      level: warn
