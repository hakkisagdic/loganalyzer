version: '3.8'

services:
  loganalyzer-lite:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.lite
    image: loganalyzer-lite:latest
    container_name: loganalyzer-lite
    restart: unless-stopped
    ports:
      - "5060:5060"
    volumes:
      - loganalyzer-data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5060
    networks:
      - coolify

volumes:
  loganalyzer-data:

networks:
  coolify:
    external: true
