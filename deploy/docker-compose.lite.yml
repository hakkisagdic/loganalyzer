version: '3.8'

services:
  loganalyzer-lite:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.lite
    image: loganalyzer-lite:latest
    container_name: loganalyzer-lite
    restart: unless-stopped
    ports:
      - "5060:5060"
    volumes:
      - loganalyzer-data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5060
      - LITE_DATA_DIR=/app/data
      - LITE_INGEST_TOKEN=${LITE_INGEST_TOKEN:-}
      - LITE_ADMIN_TOKEN=${LITE_ADMIN_TOKEN:-}
      - LITE_MAX_EVENTS=${LITE_MAX_EVENTS:-10000}
      - LITE_RETENTION_HOURS=${LITE_RETENTION_HOURS:-168}
    networks:
      - coolify

volumes:
  loganalyzer-data:

networks:
  coolify:
    external: true
