name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Derle ve birim testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `actions/setup-dotnet` yerine resmî kurulum betiği — BİLİNÇLİ.
      # Action'ın kendisi `codeload.github.com`'dan iniyor ve GitHub orayı
      # sınırlandırdığında iş KURULUMDA ölüyor: tek test koşmadan, kırmızı bir CI
      # ve tamamen ilgisiz bir hata mesajıyla. Tek oturumda üç kez oldu (429/503).
      # Betik Microsoft CDN'inden iniyor, codeload'a hiç uğramıyor.
      - name: .NET SDK kur
        run: |
          curl -fsSL --retry 5 --retry-all-errors https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --jsonfile global.json --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors açık — uyarı çıkarsa burada durur.
      # Kültür kuralları (CA1304/1305/1307/1310/1311/1862) .editorconfig'de `error`:
      # ToLower() yazan bir satır bu adımı kırar. Bkz. F1 §2.4 (Türkçe I/ı tuzağı).
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Birim testleri
        run: >
          dotnet test tests/Bizigo.UnitTests
          --no-build --configuration Release
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults

      # Katalog kalite kapısı (T05). `lint` şema + ReDoS taraması yapar, `test`
      # her parser'ın gömülü `tests` bloğunu koşturur. Testsiz parser zaten
      # şema düzeyinde reddedilir; bu adım kataloğun bütününü doğrular.
      - name: Parser kataloğu — lint
        run: >
          dotnet run --project src/Bizigo.Cli --no-build --configuration Release --
          parser lint catalog/parsers

      - name: Parser kataloğu — testler
        run: >
          dotnet run --project src/Bizigo.Cli --no-build --configuration Release --
          parser test catalog/parsers

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: TestResults/

  compose-lint:
    name: Compose dosyası ayrıştırılabiliyor mu
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # ARAÇ SEÇİMİ ÖLÇÜLDÜ. Akla gelen ilk çözüm — `python -c "import yaml;
      # yaml.safe_load(open(...))"` — bu hatayı YAKALAMIYOR: PyYAML tekrarlanan
      # anahtarı sessizce kabul edip sonuncuyu alıyor. Ölçüldü:
      # `yaml.safe_load("a: 1\na: 2")` → `{'a': 2}`, hata yok, çıkış 0.
      # Yani o bekçi yeşil yanar ve yeşilliği hiçbir şey ifade etmezdi.
      #
      # `yamllint`in `key-duplicates` kuralı tam bu hatayı hedefliyor ve
      # kırmızı yandığı ölçüldü. Kural kümesi BİLEREK tek kural: varsayılan
      # yapılandırma satır uzunluğu ve yorum aralığı gibi şeyleri de hata
      # sayıyor, ve bu dosyada bugün onlardan bolca var — kapı ilk gün kırmızı
      # yansaydı ya gevşetilir ya devre dışı bırakılırdı.
      - name: yamllint kur
        run: pip install yamllint==1.37.1

      # NEDEN AYRI VE UCUZ BİR İŞ. `compose` işinde zaten
      # `docker compose config --quiet` var ve bu hatayı gerçekten yakaladı —
      # B7 merge'ünden itibaren dört koşumda üst üste kırmızı yandı. Ama o iş
      # Docker istiyor, en geç bitenlerden biri ve kırmızılığı dört merge
      # boyunca okunmadı. Bu iş 20 saniyede aynı soruyu soruyor ve tek işi o.
      #
      # Yakaladığı hata sınıfı Git'in göremediği türden: iki ajan aynı dosyaya
      # aynı adda servis ekliyor, metinsel merge tertemiz, derleme ve testler
      # yeşil — yalnızca yığını ayağa kaldırmayı deneyen kişi öğreniyor.
      #
      # İş akışı dosyaları da kapsamda: aynı hata sınıfı orada da mümkün ve
      # oradaki bir tekrarlanan anahtar, kapının KENDİSİNİ sessizce değiştirir.
      # Sigma kuralları da kapsamda ve bunun bedeli ÖLÇÜLDÜ:
      # `catalog/sigma/rules/asa_teardown_rst.yml` aynı eşlemede
      # `message|contains` anahtarını İKİ KEZ taşıyor. YAML sonuncuyu alıyor,
      # yani `Teardown` koşulu sessizce düşüyor ve kural yalnızca `RST`
      # arıyor — başlığının söylediğinden başka bir şey yapıyor.
      #
      # Bir detection kuralında bu sınıf, compose dosyasındakinden **daha**
      # pahalı: kural yayınlanır, çalışır, hiçbir sayaç artmaz ve daraltılmış
      # hâliyle "çalışıyor" görünür.
      - name: Tekrarlanan anahtar var mı
        run: >
          yamllint -d '{rules: {key-duplicates: enable}}'
          deploy/docker-compose.yml .github/workflows/ catalog/sigma/rules/

  ui:
    name: Arayüz — tip kapısı, testler, derleme
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Tip kapısı OpenAPI belgesini `Bizigo.Api`'den üretiyor, yani burada da
      # .NET gerekiyor. Kurulum gerekçesi diğer işlerdekiyle aynı.
      - name: .NET SDK kur
        run: |
          curl -fsSL --retry 5 --retry-all-errors https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --jsonfile global.json --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Bağımlılıklar
        working-directory: ui
        run: npm ci

      # KAPI: üretilen şema ve tipler depodakiyle birebir aynı değilse düşer.
      # Aksi hâlde API'ye yeni bir uç eklenir, UI derlenmeye devam eder ve hata
      # ancak çalışma zamanında çıkar (T14).
      - name: OpenAPI tipleri güncel mi
        working-directory: ui
        run: npm run api:check

      - name: Tip denetimi
        working-directory: ui
        run: npm run typecheck

      # Ekran görüntüsü bekçileri gerçek bir tarayıcı istiyor (T28). Kurulum
      # olmadan `beforeAll` içindeki `chromium.launch()` düşer ve paket kırmızı
      # yanar — bu doğru davranış: testi kendini sessizce atlayacak hâle
      # getirmek, bekçinin kendisinden tehlikeli olurdu. Görüntüler bu turda
      # hiçbir birim testinin bulamayacağı iki yerleşim kusuru buldu; bedeli
      # bir chromium indirmesi.
      - name: Tarayıcı (ekran görüntüsü bekçileri için)
        working-directory: ui
        run: npx playwright install --with-deps chromium

      # BFF deseninin kanıtı burada koşuyor: erişim token'ı tarayıcıya ulaşmıyor.
      - name: Testler
        working-directory: ui
        run: npm test

      - name: Derleme
        working-directory: ui
        run: npm run build

  sidecar:
    name: Sidecar — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Sidecar imajı `python:3.13-slim`; testler üretimde kurulacak olandan
      # başka bir sürümde koşmamalı.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # `sigma-build`'in İÇİNE değil AYRI iş — üç gerekçe:
      #
      # 1. Sidecar'ın `requirements.txt`'i drain3'ü bir **git SHA'sından**
      #    çekiyor (upstream PyPI'ya yayımlamıyor, bkz. dosyanın başındaki not).
      #    Bunu `sigma-build`'e koymak, Sigma derleme hattını üçüncü taraf bir
      #    deponun erişilebilirliğine bağlamak olurdu — ve F3 o hatta bağlı.
      # 2. Kırmızının anlamı: kırmızı bir `sigma-build` "Sigma derlemesi bozuldu"
      #    demeli. İki paket aynı işte olsaydı kırmızı belirsizleşirdi.
      # 3. İkinci bir Python kurulumunun maliyeti `setup-python` önbellekliyken
      #    ihmal edilebilir; karşılığında iki iş paralel koşuyor.
      #
      # Testler tam bağımlılık kümesini istiyor: `drain3.masking`,
      # `fastapi.testclient` ve `app.main` üzerinden pydantic/redis/PyYAML.
      # Kısaltılmış bir kurulum denenirse import hatası verir.
      - name: Bağımlılıklar
        working-directory: sidecar
        run: pip install -r requirements-dev.txt

      # `conftest.py` maske dosyasını depo kökünden okuyor ve REDIS_URL'i
      # ulaşılamaz bir adrese sabitliyor: sidecar'ın "kalıcılık olmadan da çalış"
      # yolu böylece her koşumda sınanıyor.
      - name: Sidecar birim testleri
        working-directory: sidecar
        run: python -m pytest

  sigma-build:
    name: Sigma derleme hattı — kapılar ve testler
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Backend `requires-python >=3.13`; sidecar imajı da `python:3.13-slim`.
      # Derleme hattı üretimde kurulacak olandan başka bir sürümde koşmamalı.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Derleme adımı artık T31'in pipeline'ını gerçekten çağırıyor, yani
      # pySigma gerekiyor. `requirements.txt` sidecar'ınkine `-r` ile İŞARET
      # ETMİYOR: o dosya drain3'ü bir git SHA'sından çekiyor ve Sigma derleme
      # hattını üçüncü taraf bir deponun erişilebilirliğine bağlamak olurdu
      # (aşağıdaki `sidecar` işinin notu). Ağ, kapının gerekçesi olamaz.
      #
      # Bedeli iki dosyada aynı sürümü tutmak; karşılığı `test_requirements.py`,
      # ayrıştıkları gün kırmızı yanıyor. Ayrışma sessiz olsaydı sidecar'ın
      # `/v1/sigma/compile` ucu UI'da bir SQL gösterirken build-time başka bir
      # SQL üretirdi.
      - name: Bağımlılıklar
        run: pip install pytest==9.1.1 -r tools/sigma-build/requirements.txt

      - name: Derleme hattı birim testleri
        working-directory: tools/sigma-build
        run: python -m pytest

      # KAPI: görünüm kolon kümesi `db/clickhouse/*.sql`'den türetiliyor ve
      # `detections/schema/view-columns.json` içinde duruyor. Bir göç görünümü
      # değiştirir de bu dosya güncellenmezse kapı düşer.
      #
      # Sürüklenmenin tehlikeli yönü sessiz olan: görünümden çıkmış bir kolon
      # listede kalırsa, o kolona giden Sigma kuralı derleme kapısından GEÇER ve
      # ancak çalışma zamanında kırılır.
      - name: Görünüm kolon kümesi güncel mi
        working-directory: tools/sigma-build
        run: python -m sigma_build.view_columns --check

      # KAPI: kopyalanmış kural ağacı çivisine uyuyor mu. **Ağ kullanmıyor** —
      # kurallar `catalog/sigma/rules/` altında depoda duruyor, indirilmiyor.
      #
      # Kural setini her koşumda indirmek, bu iş dosyasının başında anlatılan
      # `setup-dotnet` tuzağını kurardı: ağ kesintisi kapıyı ilgisiz bir hata
      # mesajıyla kırmızı yandırır. Ayrıca ticket'ın kendi gerekçesini de
      # zayıflatırdı — yukarı akış kaybolduğunda SQL depoda kalır ama yeniden
      # ÜRETİLEMEZ, yani sürüklenme kapısı da koşamaz.
      - name: Kural seti çivisi tutuyor mu
        working-directory: tools/sigma-build
        run: python -m sigma_build.ruleset --verify

      # KAPI: üretilen SQL ve manifest depodakiyle birebir aynı değilse düşer.
      # Aksi hâlde bir kural değişir ve kimse fark etmez (ticket'ın kendi cümlesi).
      #
      # Bugün sıfır kural derleniyor — kural seti ve pipeline T31'i bekliyor —
      # ve kapı yine de KOŞUYOR. Bilerek: bu turda tam bu sınıftan bir hata
      # bulundu (`UNMAPPED_FIELDS` tanımlanmış ama hiçbir dönüşüme verilmemiş,
      # `unmapped_expression()` yazılmış ama hiç çağrılmamış — hazırlanmış ama
      # bağlanmamış, ve bağlanmamış olması hiçbir yerde belirti üretmiyor).
      # Kapıyı "hat bitince bağlarız" diye bekletmek aynı deseni kurardı.
      - name: Üretilen kural SQL'i güncel mi
        working-directory: tools/sigma-build
        run: python -m sigma_build.compile --check

  sigma-explain:
    name: Kapı 2 — ClickHouse üretilen SQL'i kabul ediyor mu
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # AYRI İŞ, `integration`'ın içinde DEĞİL — bilinçli. `integration` zaten
    # Testcontainers kaldırıyor ve oraya eklemek ek konteyner maliyeti
    # getirmezdi. Ama derleme kapısını entegrasyon işine bağlamak, o iş
    # ilgisiz bir sebeple düştüğünde derleme kapısının da körleşmesi demek.
    # Bu depoda "başkasının hatası yüzünden sessizleşen bekçi" deseninin
    # bedeli ödendi; konteyner maliyeti kapının kendi ayakları üstünde
    # durmasından ucuz.
    services:
      clickhouse:
        # Sürüm `deploy/docker-compose.yml` ile aynı: kapı, üretimde koşacak
        # olandan başka bir ClickHouse'a soru sorarsa cevabı da başka olur.
        image: clickhouse/clickhouse-server:26.7
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_DB: bizigo
          CLICKHOUSE_USER: bizigo
          CLICKHOUSE_PASSWORD: bizigo
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

    steps:
      - uses: actions/checkout@v5

      # Göçler ürünün KENDİ migrator'ı ile uygulanıyor, elle `.sql` çalıştırarak
      # değil. Kapı 2'nin bütün değeri "ClickHouse gerçekte ne diyor" olduğuna
      # göre, şema da üretimin kurduğu şekilde kurulmalı. İkinci bir göç
      # uygulayıcı yazmak, sorduğumuz sorunun cevabını değiştirirdi.
      - name: .NET SDK kur
        run: |
          curl -fsSL --retry 5 --retry-all-errors https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --jsonfile global.json --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"

      - name: ClickHouse hazır mı
        run: |
          for _ in $(seq 1 60); do
            if curl -sf "http://localhost:8123/ping" >/dev/null; then echo "hazır"; exit 0; fi
            sleep 2
          done
          echo "ClickHouse 120 sn içinde ayağa kalkmadı" >&2
          exit 1

      - name: Şemayı uygula
        env:
          BIZIGO_CLICKHOUSE: "Host=localhost;Port=8123;Database=bizigo;Username=bizigo;Password=bizigo"
        run: dotnet run --project src/Bizigo.Cli --configuration Release -- schema migrate db/clickhouse

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # KAPININ KENDİ SINAVI. Bugün `detections/sigma/` boş — kural seti T31'i
      # bekliyor — yani aşağıdaki adım sıfır sorgu sorup sessizce yeşil kalırdı.
      # "Sessizce yeşil bekçi" bu deponun adını koyduğu hata sınıfı, o yüzden
      # kapı önce sonucu BİLİNEN üç sorguyla sınanıyor: ikisi reddedilmeli
      # (tip uyuşmazlığı), biri kabul edilmeli. Kırmızı yanabildiği her koşumda
      # ölçülüyor, bir kez değil.
      # ÖLÇÜM (kapı değil): aday `EXPLAIN` biçimlerini yan yana koyup hangisinin
      # tip hatasını gördüğünü ve sorgu başına kaç ms sürdüğünü basıyor.
      # Yalnızca HİÇBİR biçim ayırt edemezse düşüyor.
      #
      # Neden her koşumda: ilk biçim seçimi (`EXPLAIN SYNTAX`) tahminle
      # yapılmıştı ve kapıyı sessizce yeşil bırakıyordu. Bir ClickHouse
      # yükseltmesi aynı şeyi tekrar yapabilir; o gün bu tablo söyler.
      - name: Hangi EXPLAIN biçimi tip hatasını görüyor
        working-directory: tools/sigma-build
        run: python -m sigma_build.explain_gate --probe-forms --clickhouse-url http://localhost:8123

      - name: Kapı 2 kırmızı yanabiliyor mu
        working-directory: tools/sigma-build
        run: python -m sigma_build.explain_gate --self-test --clickhouse-url http://localhost:8123

      - name: Üretilen SQL'i ClickHouse kabul ediyor mu
        working-directory: tools/sigma-build
        run: python -m sigma_build.explain_gate --clickhouse-url http://localhost:8123

      # KAPI 3'ÜN ÇEVRİMDIŞI YARISI. Kapının kendisi **yüklü altın örnek**
      # istiyor ve bu iş yalnızca şema kuruyor, veri yüklemiyor — canlı yarısı
      # koordinatörde koşuyor (§2).
      #
      # Burada koşan şey beyan listesinin **şekli**: kapı "eşleşen" ile
      # "eşleşmeyen"i ayırt edebildiğini gösterebiliyor mu. Yalnızca
      # `at_least_one` beyanlarından oluşan bir liste, her şeyi eşleştiren bozuk
      # bir kapı tarafından da geçilirdi.
      #
      # Bugün sıfır kural üretiliyor (kural seti çivisi boş), o yüzden sıfır
      # beyan isteniyor ve adım yeşil. İlk kural üretildiği anda kapı
      # kendiliğinden diş kazanıyor — koşul "üretilen her kural beyanlı olmalı".
      - name: Kapı 3 beyan listesi ayırt edebiliyor mu
        working-directory: tools/sigma-build
        run: python -m sigma_build.golden_gate --shape-only

  integration:
    name: Entegrasyon testleri (Testcontainers)
    runs-on: ubuntu-latest
    # ClickHouse + Postgres + RustFS container'ları ayağa kalkıyor.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # `actions/setup-dotnet` yerine resmî kurulum betiği — BİLİNÇLİ.
      # Action'ın kendisi `codeload.github.com`'dan iniyor ve GitHub orayı
      # sınırlandırdığında iş KURULUMDA ölüyor: tek test koşmadan, kırmızı bir CI
      # ve tamamen ilgisiz bir hata mesajıyla. Tek oturumda üç kez oldu (429/503).
      # Betik Microsoft CDN'inden iniyor, codeload'a hiç uğramıyor.
      - name: .NET SDK kur
        run: |
          curl -fsSL --retry 5 --retry-all-errors https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --jsonfile global.json --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Entegrasyon testleri
        run: >
          dotnet test tests/Bizigo.IntegrationTests
          --no-build --configuration Release
          --logger "trx;LogFileName=integration.trx"
          --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: TestResults/

  # ---------------------------------------------------------------------------
  # Uçtan uca: ÇALIŞAN ürünün ekran görüntüleri.
  #
  # `ui` işindeki ekran görüntüsü bekçisiyle karışmasın — o bileşenleri doğrudan
  # çiziyor ve Next sunucusu, Keycloak ya da API görmüyor. Burada üçü de gerçek:
  # tarayıcı Keycloak'ın kendi giriş sayfasından geçiyor, veri ClickHouse'tan
  # geliyor ve kapsam `idp_group_mapping` üzerinden uygulanıyor. İkisi aynı işi
  # yapmıyor; biri görünümü, diğeri zinciri kanıtlıyor.
  # ---------------------------------------------------------------------------
  e2e:
    name: Uçtan uca — çalışan ürün
    runs-on: ubuntu-latest
    # Yığın + iki derleme + tarayıcı gezintisi. Entegrasyon işinden uzun.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      # Gerekçesi `integration` işindekiyle aynı: `actions/setup-dotnet`
      # codeload'dan iniyor ve sınırlandığında iş kurulumda ölüyor.
      - name: .NET SDK kur
        run: |
          curl -fsSL --retry 5 --retry-all-errors https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --jsonfile global.json --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Bağımlılıklar
        working-directory: ui
        run: npm ci

      - name: Tarayıcı
        working-directory: ui
        run: npx playwright install --with-deps chromium

      # Yığın compose ile kalkıyor: dokuz servisin yapılandırması zaten orada
      # ve ikinci bir tanım yazmak, ikisinin ayrışabileceği bir yer daha
      # açardı. Uçtan uca koşum bu beşini istiyor.
      - name: Yığın ayağa kalksın
        working-directory: deploy
        run: |
          cp .env.example .env
          # `|| { logs; exit 1; }` şart: `up --wait` düştüğünde konteynerin KENDİ
          # hata mesajını yutuyor ve geriye teşhis edilemez bir satır kalıyor.
          docker compose up -d --build --wait --wait-timeout 600 \
            clickhouse postgres rustfs keycloak sidecar || {
            echo "=== compose up başarısız — servis logları ==="
            docker compose ps -a
            docker compose logs --no-color --tail 200
            exit 1
          }
          docker compose ps

      # `npm run e2e` = hazırlık (yığın kontrolü, derleme, tohumlama, Next
      # derlemesi) + Playwright. Başsız: runner'da ekran yok.
      - name: Uçtan uca koşum
        working-directory: ui
        run: npm run e2e

      # Görüntüler işin ÜRÜNÜ, yan çıktısı değil: kırmızı koşumda da yükleniyor
      # çünkü yarıda kalan bir gezinti nerede durduğunu görüntüyle söylüyor.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uctan-uca-ekran-goruntuleri
          path: docs/ekran-goruntuleri/uctan-uca/
          if-no-files-found: error

      # İz ve video yalnızca düşen koşumda üretiliyor (`retain-on-failure`).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: uctan-uca-izler
          path: ui/.playwright/
          if-no-files-found: ignore

      - name: Yığın logları
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color --tail 300

      - name: Yığını indir
        if: always()
        working-directory: deploy
        run: docker compose down -v

  compose:
    name: Geliştirme ortamı doğrulaması
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Compose yapılandırması geçerli mi
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Yığın ayağa kalkıyor mu
        working-directory: deploy
        run: |
          # `|| { logs; exit 1; }` şart: `up --wait` başarısız olduğunda yalnızca
          # "container X exited (1)" yazıyor, konteynerin KENDİ hata mesajını
          # yutuyor. Yapılandırma hatalarını teşhis etmenin tek yolu bu döküm.
          docker compose up -d --build --wait --wait-timeout 600 || {
            echo "=== compose up başarısız — servis logları ==="
            docker compose ps -a
            docker compose logs --no-color --tail 200
            exit 1
          }
          docker compose ps

      - name: Sağlıksız servis var mı
        if: always()
        working-directory: deploy
        run: |
          unhealthy=$(docker compose ps --format json \
            | python3 -c "import sys,json;[print(json.loads(l)['Service']) for l in sys.stdin if l.strip() and 'healthy' not in json.loads(l).get('Health','') and json.loads(l).get('Health')]" || true)
          if [ -n "$unhealthy" ]; then
            echo "sağlıksız: $unhealthy"
            docker compose logs --tail 100
            exit 1
          fi
          echo "tüm servisler sağlıklı"

      - name: Temizlik
        if: always()
        working-directory: deploy
        run: docker compose down -v
