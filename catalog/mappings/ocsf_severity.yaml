# OCSF severity_id — `core.severity_num` kolonunun beslendiği tablo.
#
# OCSF ölçeği: 0 Unknown · 1 Informational · 2 Low · 3 Medium · 4 High
#              5 Critical · 6 Fatal
#
# Tek tabloda iki anahtar ailesi var ve çakışmıyorlar:
#   * syslog severity rakamı ("0".."7") — Cisco ASA'nın `%ASA-6-` alanı, syslog
#     PRI'sinin alt üç biti. Ölçek TERS: 0 = emergency, 7 = debug.
#   * cihazın bastığı seviye kelimesi — FortiGate `level="notice"`, MikroTik
#     topic listesindeki `error`/`warning`/`info`.
#
# Bu tablo OCSF ölçeğini yazar ve `severity_num` kolonunun tek gerçeğidir.
# OTel görünümü (`SeverityNumber`, 1–24) aynı kolondan okuyordu ve ölçek
# çevrimi yoktu — OCSF Critical (5) OTel'de DEBUG çıkıyordu. T05
# `db/clickhouse/0004_fix_otel_severity_scale.sql` ile çevrimi ekledi; ham OCSF
# değeri `bizigo.ocsf_severity_id` olarak yanında taşınıyor.

# --- syslog severity rakamı ---
"0": 6
"1": 5
"2": 5
"3": 4
"4": 3
"5": 1
"6": 1
"7": 1

# --- seviye kelimesi ---
emergency: 6
