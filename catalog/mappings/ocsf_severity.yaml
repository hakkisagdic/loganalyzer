# OCSF severity_id — `core.severity_num` kolonunun beslendiği tablo.
#
# OCSF ölçeği: 0 Unknown · 1 Informational · 2 Low · 3 Medium · 4 High
#              5 Critical · 6 Fatal
#
# Tek tabloda iki anahtar ailesi var ve çakışmıyorlar:
#   * syslog severity rakamı ("0".."7") — Cisco ASA'nın `%ASA-6-` alanı, syslog
#     PRI'sinin alt üç biti. Ölçek TERS: 0 = emergency, 7 = debug.
#   * cihazın bastığı seviye kelimesi — FortiGate `level="notice"`, MikroTik
#     topic listesindeki `error`/`warning`/`info`.
#
# UYARI (T08 → T05/T07): `severity_num` kolonu OCSF görünümünde `severity_id`,
# OTel görünümünde `SeverityNumber` olarak okunuyor (db/clickhouse/0003). Bu iki
# ölçek aynı değil (OTel 1–24). Katalog OCSF ölçeğini yazıyor; OTel görünümünün
# ayrı bir türetmeye ihtiyacı var.

# --- syslog severity rakamı ---
"0": 6
"1": 5
"2": 5
"3": 4
"4": 3
"5": 1
"6": 1
"7": 1

# --- seviye kelimesi ---
emergency: 6
emerg: 6
alert: 5
critical: 5
crit: 5
error: 4
err: 4
warning: 3
warn: 3
notice: 1
information: 1
informational: 1
info: 1
debug: 1

# Fortinet ve MikroTik'in kendi yazımları (ordinal arama — her yazım ayrı satır).
Emergency: 6
Alert: 5
Critical: 5
Error: 4
Warning: 3
Notice: 1
Information: 1
Debug: 1
