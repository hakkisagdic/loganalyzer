# Kaynak: OCSF şeması, Network Activity sınıfı.
#   0 Unknown · 1 Open · 2 Close · 3 Reset · 4 Fail · 5 Refuse · 6 Traffic · 99 Other
#
# Anahtar, cihazın bastığı `action` değeridir ve ORDINAL karşılaştırılır.
# Vendor'lar aynı anlamı farklı yazar; her yazımı ayrı satır olarak eklemek,
# büyük/küçük harf normalizasyonuna güvenmekten güvenlidir (F1 §2.4).

