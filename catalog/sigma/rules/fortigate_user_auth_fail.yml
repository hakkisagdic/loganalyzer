title: "FortiGate: kimlik doğrulama hatası"
id: 03702803-0000-4000-8000-000000000000
status: experimental
description: >-
  T30 ölçüm örneklemi. Kural `status: 'failure'` arıyordu; FortiGate
  `status="failed"` yazıyor. **Dizge dışında her şey doğruydu** — üretilen SQL
  doğru, `status` kolonu doğru, veri de var. Yalnızca aranan sözcük vendor'ın
  yazdığı sözcük değildi.

  Bu, `asa_teardown_rst` (`RST` ↔ `Reset-I`) ve `routeros_forward_new`
  (`action` ↔ `fw_chain`) ile aynı sınıf: kural, vendor'ın yazdığını değil
  **yazacağını varsaydığımızı** arıyor. Üçü de dışarıdan "eşleşmiyor" diye
  görünüyordu ve üçünün sebebi farklı sanılıyordu.

  Düz bir varlık kontrolü bunu "örneklemde desen yok" sayardı — yani
  düzeltilebilir bir kural hatası, ölçülemez bir örneklem boşluğu gibi
  okunurdu. `explain_misses.py`'nin yakın-sözcük uyarısı ayırdı:
  `'failure' ↔ failed`.
logsource:
  category: firewall
  product: fortigate
detection:
  selection:
    status: 'failed'
    user|contains: 'admin'
  condition: selection
level: medium
