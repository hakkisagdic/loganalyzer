apiVersion: bizigo.dev/v1
kind: Parser
metadata:
  id: nginx.access.combined
  version: 1.0.0
  vendor: NGINX
  product: nginx
  license: Apache-2.0
  description: >
    nginx `combined` access log. Sanal sunucu adı önekli varyantı (`$host` ilk
    alan) ve `$request_time` ekli varyantı da tek pattern'de karşılıyor.
  specificity: 50

match:
  transport: [file, otlp, syslog]
  # Sürüm etiketinin hemen ardından gelen çift tırnak, istek satırının
  # kapanışıdır: combined/common formatlarda vardır, cihaz loglarında yoktur.
  contains: ['HTTP/1.1"', 'HTTP/1.0"', 'HTTP/2.0"']

# nginx'in sayısal alanları için dar bir sayı pattern'i.
#
# Upstream `NUMBER` → `BASE10NUM`, o da `(?<![0-9.+-])(?>...)` yazıyor: hem
# lookbehind hem atomik grup, ikisi de `NonBacktracking` tarafından
# desteklenmiyor. Paylaşılan sette düzeltmek DENENDİ VE VAZGEÇİLDİ (T08 raporu):
# atomik grup burada `YEAR`'daki gibi etkisiz değil — kaldırınca
# `%{NUMBER}\.%{NUMBER}` bileşimi upstream'de hiç eşleşmezken eşleşir hale
# geliyor, yani değişiklik DAHA GEÇİRGEN yönde. Lookbehind'ın da lookaround'suz
# karşılığı yok: `\b` `-5`'i kırar, karakter tüketen bir öncül eşleşme
# uzunluğunu kaydırır.
#
# Bu yüzden daraltma bağlama özel ve parser'a yerel. nginx bu alanlara yalnızca
# işaretsiz ondalık yazıyor: durum kodu, bayt sayısı, `$request_time` ve HTTP
# sürümü. İşaret ve baştan noktalı biçim (`-5`, `.5`) bu alanlarda hiç geçmiyor.
pattern_definitions:
  NGINX_NUM: '(?:[0-9]+(?:\.[0-9]+)?)'

pipeline:
  # Tek pattern, üç varyant:
  #   * isteğe bağlı sanal sunucu öneki  (`$host` log_format'a eklenmişse)
  #   * `bytes` yerine `-`               (gövde yokken nginx tire yazar)
  #   * isteğe bağlı `$request_time`     (yaygın bir combined türevi)
  - grok:
      field: message
      patterns:
        - '^(?:%{IPORHOST:http_vhost} )?%{IPORHOST:clientip} %{USER:ident} %{USER:auth} \[%{HTTPDATE:log_timestamp}\] "%{WORD:http_method} %{NOTSPACE:url_path} HTTP/%{NGINX_NUM:http_version}" %{NGINX_NUM:response:int} (?:%{NGINX_NUM:bytes:long}|-)(?: %{NGINX_NUM:request_time:float})? "%{DATA:referrer}" "%{DATA:agent}"$'

  - date:
      field: log_timestamp
      formats: ["dd/MMM/yyyy:HH:mm:ss zzz"]
      default_timezone: UTC

  # `ident` her zaman "-", tutulmasının bir değeri yok.
  - drop:
      fields: [ident]

map:
  core:
    vendor: NGINX
    product: nginx
    host: "{{ http_vhost }}"
    src_ip: "{{ clientip }}"
    proto: tcp
    action: "{{ http_method }}"
    outcome: { from: response, table: http_status_outcome }
    user_name: "{{ auth }}"
    severity_num: 1

  ocsf:
    class_uid: 4002
    activity_id: { from: http_method, table: ocsf_http_activity, default: 99 }

  otel:
    "http.request.method": "{{ http_method }}"
    "http.response.status_code": "{{ response }}"
    "http.response.body.size": "{{ bytes }}"
    "url.path": "{{ url_path }}"
    "http.request.header.referer": "{{ referrer }}"
    "user_agent.original": "{{ agent }}"
    "network.protocol.name": http
    "network.protocol.version": "{{ http_version }}"

tests:
  - name: klasik combined satırı
    input: '198.51.100.13 - - [25/Oct/2016:14:49:33 +0200] "GET / HTTP/1.1" 200 612 "-" "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_12_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/54.0.2840.59 Safari/537.36"'
    expect:
      parse_status: ok
      core.src_ip: "198.51.100.13"
      core.action: "GET"
      core.outcome: "success"
      ocsf.class_uid: 4002
      ocsf.activity_id: 3
      fields.response: 200
      fields.bytes: 612
      otel.url.path: "/"
      "@timestamp": "2016-10-25T14:49:33.0000000+02:00"

  - name: sanal sunucu önekli varyant, yüzde kodlu yol
    input: 'lessons.example.com 192.168.0.1 - - [09/Jun/2020:12:10:39 -0700] "GET /A%20Beka%20G1%20Howe/029_AND_30/15%20reading%20elephants.mp4 HTTP/1.1" 206 7648063 "http://lessons.example.com/A%20Beka%20G1%20Howe/029_AND_30/15%20reading%20elephants.mp4" "Mozilla/5.0 (Linux; Android 5.1.1; KFFOWI) AppleWebKit/537.36 (KHTML, like Gecko) Silk/81.2.16 like Chrome/81.0.4044.138 Safari/537.36"'
    expect:
      parse_status: ok
      core.host: "lessons.example.com"
      core.src_ip: "192.168.0.1"
      fields.response: 206
      fields.bytes: 7648063
      "@timestamp": "2020-06-09T12:10:39.0000000-07:00"

  - name: request_time ekli varyant
    input: '127.0.0.1 - - [07/Dec/2016:11:05:07 +0100] "GET /taga HTTP/1.1" 404 169 45.324 "-" "Mozilla/5.0 (Macintosh; Intel Mac OS X 10.12; rv:49.0) Gecko/20100101 Firefox/49.0"'
    expect:
      parse_status: ok
      core.outcome: "failure"
      fields.request_time: 45.324
      fields.response: 404

  # --- negatif testler ---
  - name: negatif — nginx JSON satırı combined değil
    input: '{"time": "17/May/2015:08:05:34 +0000", "remote_ip": "198.51.100.5", "remote_user": "-", "request": "GET /downloads/product_1 HTTP/1.1", "response": 200, "bytes": 490, "referrer": "-", "agent": "Debian APT-HTTP/1.3 (0.8.10.3)"}'
    expect:
      parse_status: failed

  - name: negatif — MikroTik firewall satırı
    input: 'Oct 19 14:18:28 192.168.85.1 firewall,info forward: in:ether1 out:bridge, src-mac 00:b2:4e:33:f2:19, proto UDP, 203.0.113.7:53722->192.168.85.12:62181, len 78'
    expect:
      parse_status: failed
