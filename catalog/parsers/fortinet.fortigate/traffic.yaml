apiVersion: bizigo.dev/v1
kind: Parser
metadata:
  id: fortinet.fortigate.traffic
  version: 1.0.0
  vendor: Fortinet
  product: FortiGate
  license: Apache-2.0
  description: >
    FortiOS `type="traffic"` ve `type="utm"` satırları — güvenlik duvarı oturum
    kayıtları ve UTM profillerinin (webfilter/ips/virus/app-ctrl/dns) ürettiği
    kayıtlar. İkisi de aynı anahtar=değer gövdesini ve aynı ağ alanlarını
    kullanıyor; ayrı parser'a bölmek aynı boru hattını iki kez yazmak olurdu.
  specificity: 70

match:
  transport: [syslog, otlp]
  # Tırnaklı yazım FortiOS 5.6+ ile geldi ve gerçek cihazların tamamı böyle
  # basıyor. `type=` tek başına ayırt edici değil; tam ifade ayırt edici.
  contains: ['type="traffic"', 'type="utm"']

pipeline:
  # 0) KAPI ADIMI — `match.contains` dispatcher'ın yalnızca 2. kademesinde
  #    çalışıyor; envantere bağlı kaynak (kademe 1) ön filtreyi hiç görmüyor.
  #    Ayırt ediciliğin boru hattında da olması gerekiyor.
  #    (T08 raporu, motor eksiği #4.)
  - grok:
      field: message
      patterns:
        - 'type="(?<log_type>traffic|utm)"'

  # 1) Zarfı soy, zaman damgasını TEK alanda topla.
  #
  # FortiGate tarihi `date=` ve saati `time=` diye AYRI iki anahtarda yazar.
  # `date` adımı tek bir `field` alır ve motorda alan birleştirme yok; bu yüzden
  # ikisinin arasındaki `time=` metnini de yakalamaya dahil edip biçim dizesinde
  # sabit metin olarak tüketiyoruz. (T08 raporu, motor eksiği #1.)
  - grok:
      field: message
      patterns:
        - '^(?:<%{NONNEGINT:syslog_pri:int}>)?(?<kv_body>date=(?<log_datetime>%{YEAR}-%{MONTHNUM2}-%{MONTHDAY} time=%{TIME}) %{GREEDYDATA})$'

  # 2) Anahtar=değer gövdesi. `quoted: true` şart: FortiGate
  #    `msg="URL belongs to a denied category in policy"` yazıyor.
  - kv:
      field: kv_body
      separator: " "
      assign: "="
      quoted: true

  - date:
      field: log_datetime
      formats: ["yyyy-MM-dd 'time='HH:mm:ss"]
      # `tz="-0500"` alanı BİLE BİLE kullanılmıyor: motor saat dilimini IANA
      # adıyla çözüyor, sayısal ofseti tanımıyor ve sessizce buraya düşerdi.
      # (T08 raporu, motor eksiği #2.)
      default_timezone: Europe/Istanbul

  - convert:
      fields:
        srcport: int
        dstport: int
        sentbyte: long
        rcvdbyte: long
        sentpkt: long
        rcvdpkt: long
        policyid: int
        sessionid: long

  # Ham gövde `message` alanında zaten duruyor; ikinci kopya `attrs` sözlüğünü
  # satır başına bir kez daha şişirirdi.
  - drop:
      fields: [kv_body]

map:
  core:
    vendor: Fortinet
    product: FortiGate
    host: "{{ devname }}"
    src_ip: "{{ srcip }}"
    dst_ip: "{{ dstip }}"
    src_port: "{{ srcport }}"
    dst_port: "{{ dstport }}"
    proto: { from: proto, table: ip_proto_name }
    action: "{{ action }}"
    user_name: "{{ user }}"
    severity_num: { from: level, table: ocsf_severity, default: 0 }

  ocsf:
    class_uid: 4001
    activity_id: { from: action, table: ocsf_network_activity, default: 99 }

  otel:
    "network.transport": { from: proto, table: ip_proto_name }
    "source.address": "{{ srcip }}"
    "source.port": "{{ srcport }}"
    "destination.address": "{{ dstip }}"
    "destination.port": "{{ dstport }}"
    "network.protocol.name": "{{ service }}"
    "observer.ingress.interface.name": "{{ srcintf }}"
    "observer.egress.interface.name": "{{ dstintf }}"
    "url.domain": "{{ hostname }}"
    "url.path": "{{ url }}"

tests:
  - name: FortiOS 7.x forward trafiği — syslog zarfı yok
    input: 'date=2019-05-10 time=11:37:47 logid="0000000013" type="traffic" subtype="forward" level="notice" vd="vdom1" eventtime=1557513467369913239 srcip=10.1.100.11 srcport=58012 srcintf="port12" srcintfrole="undefined" dstip=203.0.113.142 dstport=80 dstintf="port11" dstintfrole="undefined" sessionid=105048 proto=6 action="close" policyid=1 policytype="policy" service="HTTP" duration=116 sentbyte=1188 rcvdbyte=1224 sentpkt=17 rcvdpkt=16 utmaction="allow"'
    expect:
      parse_status: ok
      core.src_ip: "10.1.100.11"
      core.dst_ip: "203.0.113.142"
      core.src_port: 58012
      core.dst_port: 80
      core.proto: "tcp"
      core.action: "close"
      core.severity_num: 1
      ocsf.class_uid: 4001
      ocsf.activity_id: 2
      fields.sentbyte: 1188
      fields.policyid: 1
      "@timestamp": "2019-05-10T11:37:47.0000000+03:00"

  - name: syslog PRI ve devname'li deny satırı
    input: '<189>date=2020-04-23 time=01:16:08 devname="testswitch1" devid="somerouterid" logid="0000000013" type="traffic" subtype="forward" level="notice" vd="OPERATIONAL" eventtime=1592961368 srcip=10.10.10.10 srcport=60899 srcintf="srcintfname" srcintfrole="lan" dstip=198.51.100.13 dstport=161 dstintf="dstintfname" dstintfrole="lan" sessionid=155313 proto=17 action="deny" policyid=0 policytype="policy" service="SNMP" trandisp="noop" duration=0 sentbyte=0 rcvdbyte=0 sentpkt=0 appcat="unscanned" crscore=30 craction=131072 crlevel="high"'
    expect:
      parse_status: ok
      core.host: "testswitch1"
      core.proto: "udp"
      core.action: "deny"
      ocsf.activity_id: 5
      fields.syslog_pri: 189

  - name: UTM webfilter — tırnaklı boşluklu msg ve kullanıcı adı
    input: '<188>date=2020-04-23 time=12:17:48 devname="testswitch1" devid="somerouterid" logid="0316013056" type="utm" subtype="webfilter" eventtype="ftgd_blk" level="warning" vd="root" eventtime=1587230269052907555 tz="-0500" policyid=100602 sessionid=1234 user="elasticuser" group="elasticgroup" srcip=192.168.2.1 srcport=61930 srcintf="port1" dstip=198.51.100.13 dstport=443 dstintf="wan1" proto=6 service="HTTPS" hostname="elastic.co" profile="elasticruleset" action="blocked" reqtype="direct" url="/config/" sentbyte=1152 rcvdbyte=1130 direction="outgoing" msg="URL belongs to a denied category in policy" method="domain" cat=76 catdesc="Internet Telephony"'
    expect:
      parse_status: ok
      core.user_name: "elasticuser"
      core.action: "blocked"
      core.severity_num: 3
      ocsf.activity_id: 5
      otel.url.domain: "elastic.co"
      fields.msg: "URL belongs to a denied category in policy"
      fields.catdesc: "Internet Telephony"

  - name: UTM IPS imza olayı
    input: 'date=2019-05-15 time=17:56:41 logid="0419016384" type="utm" subtype="ips" eventtype="signature" level="alert" vd="root" eventtime=1557968201 severity="critical" srcip=10.1.100.22 dstip=172.16.200.55 srcintf="port10" dstintf="port9" sessionid=4017 action="dropped" proto=6 service="HTTP" policyid=1 attack="Adobe.Flash.newfunction.Handling.Code.Execution" srcport=46810 dstport=80 hostname="172.16.200.55" url="/ips/sig1.pdf" direction="incoming" attackid=23305'
    expect:
      parse_status: ok
      core.action: "dropped"
      core.severity_num: 5
      ocsf.activity_id: 5
      fields.attack: "Adobe.Flash.newfunction.Handling.Code.Execution"

  # --- negatif testler ---
  - name: negatif — FortiGate event satırı bu parser'a düşmemeli
    input: 'date=2019-05-13 time=11:20:54 logid="0100032001" type="event" subtype="system" level="information" vd="vdom1" eventtime=1557771654587081441 logdesc="Admin login successful" user="admin" method="ssh" srcip=172.16.200.254 dstip=172.16.200.2 action="login" status="success"'
    expect:
      parse_status: failed

  - name: negatif — Cisco ASA satırı
    input: 'Oct 10 2018 12:34:56 fw-01 CiscoASA[999]: %ASA-6-302013: Built outbound TCP connection 11757 for outside:198.51.100.104/80 (198.51.100.104/80) to inside:172.31.98.44/1772 (172.31.98.44/1772)'
    expect:
      parse_status: failed

  - name: negatif — nginx combined satırı
    input: '198.51.100.13 - - [25/Oct/2016:14:49:33 +0200] "GET / HTTP/1.1" 200 612 "-" "Mozilla/5.0"'
    expect:
      parse_status: failed
